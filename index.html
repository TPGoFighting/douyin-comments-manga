                      className="w-40 accent-black"
                    />
                    <span className="font-mono text-rose-600 font-extrabold">{minPtsd}+ 分</span>
                    <span className="ml-auto text-slate-500">
                      展示 <span className="text-black font-extrabold font-mono">{filteredComments.length}</span> / {comments.length} 条
                    </span>
                  </div>
                </div>

                {/* Comments Grid */}
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                  {filteredComments.slice(0, 90).map((c) => {
                    const hasReplies = c.replies && c.replies.length > 0;
                    const isExpanded = expandedReplies[c.id];

                    return (
                      <div
                        key={c.id}
                        onClick={() => setSelectedComment(c)}
                        className="comic-panel p-4 bg-white cursor-pointer flex flex-col justify-between space-y-3 group"
                      >
                        <div className="space-y-2.5">
                          <div className="flex items-center justify-between text-xs">
                            <div className="flex items-center space-x-2">
                              <img src={c.avatar} alt={c.author} className="w-7 h-7 rounded-full border-2 border-black object-cover" />
                              <div>
                                <span className="font-extrabold text-black block truncate max-w-[110px]">{c.author}</span>
                                <span className="text-[10px] text-slate-500 font-mono">{c.location} · {c.time}</span>
                              </div>
                            </div>

                            <span className={`text-[10px] font-mono px-2 py-0.5 rounded-full font-bold border border-black ${
                              c.ptsd_score > 70 ? 'bg-rose-200 text-rose-800' : 'bg-slate-100 text-slate-700'
                            }`}>
                              PTSD {c.ptsd_score}
                            </span>
                          </div>

                          <div className="speech-bubble p-3 bg-yellow-50">
                            <p className="text-xs text-black font-medium leading-relaxed line-clamp-3">
                              {c.content}
                            </p>
                          </div>

                          {/* Sub Replies */}
                          {hasReplies && (
                            <div className="pt-1">
                              <button
                                onClick={(e) => toggleReply(c.id, e)}
                                className="text-[11px] font-bold text-sky-700 hover:text-sky-900 flex items-center gap-1"
                              >
                                <i data-lucide={isExpanded ? 'chevron-up' : 'chevron-down'} className="w-3 h-3"></i>
                                <span>{isExpanded ? '收起回复' : `展开 ${c.replies.length} 条回复`}</span>
                              </button>

                              {isExpanded && (
                                <div className="mt-2 space-y-2 bg-slate-50 p-2.5 rounded-xl border border-black text-xs">
                                  {c.replies.map((r, rIdx) => (
                                    <div key={rIdx} className="space-y-0.5 border-b border-slate-200 pb-1.5 last:border-0 last:pb-0">
                                      <div className="flex justify-between text-[10px] text-slate-600 font-bold">
                                        <span>{r.author} ({r.location})</span>
                                        <span>{r.likes} 赞</span>
                                      </div>
                                      <p className="text-slate-800 font-medium">{r.content}</p>
                                    </div>
                                  ))}
                                </div>
                              )}
                            </div>
                          )}
                        </div>

                        <div className="pt-2 border-t-2 border-black flex items-center justify-between text-[11px]">
                          <span className="font-bold text-slate-700">#{c.tags[0]}</span>
                          <button
                            onClick={(e) => handleToggleLike(c.id, e)}
                            className={`flex items-center gap-1 font-mono font-bold ${likedComments[c.id] ? 'text-rose-600' : 'text-slate-700'}`}
                          >
                            <i data-lucide="heart" className={`w-3.5 h-3.5 ${likedComments[c.id] ? 'fill-rose-500 text-rose-500' : ''}`}></i>
                            <span>{c.likes + (likedComments[c.id] ? 1 : 0)}</span>
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* TAB 6: GOLDEN QUOTES */}
            {activeTab === 'quotes' && (
              <div className="space-y-6">
                <div className="halftone-box p-6 bg-purple-200">
                  <h2 className="text-2xl font-black text-black comic-font flex items-center gap-2">
                    <span>🏆 评论区神回复与攻击性艺术排行榜</span>
                  </h2>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                  {comments.filter(c => c.is_gold).map((c, idx) => (
                    <div
                      key={c.id}
                      onClick={() => setSelectedComment(c)}
                      className="comic-panel p-5 bg-white cursor-pointer space-y-3 group"
                    >
                      <div className="flex items-center justify-between">
                        <span className="sticker-badge bg-yellow-300 text-black">TOP #{idx + 1}</span>
                        <span className="font-mono font-black text-rose-600 text-xs">
                          ❤️ {c.likes + (likedComments[c.id] ? 1 : 0)} 赞
                        </span>
                      </div>

                      <div className="speech-bubble p-4 bg-yellow-50">
                        <p className="text-sm font-extrabold text-black leading-relaxed">
                          “{c.content}”
                        </p>
                      </div>

                      <div className="flex items-center justify-between text-xs text-slate-600 pt-1">
                        <div className="flex items-center space-x-2">
                          <img src={c.avatar} alt={c.author} className="w-5 h-5 rounded-full border border-black object-cover" />
                          <span className="font-bold">{c.author} ({c.location})</span>
                        </div>
                        <span className="font-mono font-bold text-rose-700">血压 {c.ptsd_score} 分</span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

          </main>

          {/* Fullscreen Uncropped Image Preview Modal */}
          {previewImage && (
            <div
              onClick={() => setPreviewImage(null)}
              className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm cursor-pointer"
            >
              <div className="relative max-w-4xl max-h-[95vh] bg-white p-3 rounded-2xl border-4 border-black shadow-comic-xl flex flex-col items-center">
                <img
                  src={previewImage.file}
                  alt={previewImage.title}
                  className="max-h-[82vh] max-w-full w-auto h-auto object-contain rounded-xl border-2 border-black"
                />
                <div className="mt-3 w-full flex items-center justify-between px-2">
                  <span className="font-black text-sm text-black">{previewImage.title}</span>
                  <button
                    onClick={() => setPreviewImage(null)}
                    className="comic-btn bg-yellow-300 px-4 py-1 text-xs"
                  >
                    关闭
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Comment Detail Modal */}
          {selectedComment && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-sm">
              <div className="halftone-box max-w-lg w-full p-6 space-y-4 relative bg-white">
                <button
                  onClick={() => setSelectedComment(null)}
                  className="absolute top-4 right-4 p-1.5 rounded-full bg-slate-100 hover:bg-slate-200 border-2 border-black"
                >
                  <i data-lucide="x" className="w-4 h-4"></i>
                </button>

                <div className="flex items-center space-x-3">
                  <img src={selectedComment.avatar} alt={selectedComment.author} className="w-12 h-12 rounded-full border-3 border-black object-cover" />
                  <div>
                    <h4 className="font-black text-base text-black">{selectedComment.author}</h4>
                    <p className="text-xs text-slate-500 font-mono">{selectedComment.location} · {selectedComment.time}</p>
                  </div>
                </div>

                <div className="speech-bubble p-4 bg-yellow-50">
                  <p className="text-sm font-extrabold text-black leading-relaxed">
                    “{selectedComment.content}”
                  </p>
                </div>

                <div className="grid grid-cols-2 gap-3 text-xs">
                  <div className="p-3 rounded-xl bg-rose-100 border-2 border-black">
                    <span className="text-slate-700 font-bold">血压创伤分</span>
                    <div className="text-xl font-black font-mono text-rose-600 mt-0.5">{selectedComment.ptsd_score} 分</div>
                  </div>
                  <div className="p-3 rounded-xl bg-yellow-100 border-2 border-black">
                    <span className="text-slate-700 font-bold">点赞数</span>
                    <div className="text-xl font-black font-mono text-black mt-0.5">
                      {selectedComment.likes + (likedComments[selectedComment.id] ? 1 : 0)} 次
                    </div>
                  </div>
                </div>

                {selectedComment.replies && selectedComment.replies.length > 0 && (
                  <div className="space-y-2">
                    <span className="text-xs font-black text-black">子回复讨论：</span>
                    <div className="space-y-2 bg-slate-100 p-3 rounded-xl border-2 border-black text-xs">
                      {selectedComment.replies.map((r, idx) => (
                        <div key={idx} className="space-y-0.5">
                          <div className="text-[11px] font-bold text-slate-700">{r.author} ({r.location})</div>
                          <p className="text-slate-900 font-medium">{r.content}</p>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                <div className="pt-2 border-t-2 border-black flex justify-end gap-2">
                  <button
                    onClick={(e) => handleToggleLike(selectedComment.id, e)}
                    className="comic-btn bg-pink-300 px-4 py-1.5 text-xs font-bold"
                  >
                    ❤️ {likedComments[selectedComment.id] ? '已点赞' : '点赞'}
                  </button>
                  <button
                    onClick={() => {
                      navigator.clipboard.writeText(selectedComment.content);
                      alert('已复制评论内容！');
                    }}
                    className="comic-btn bg-sky-200 px-4 py-1.5 text-xs font-bold"
                  >
                    复制文本
                  </button>
                  <button
                    onClick={() => setSelectedComment(null)}
                    className="comic-btn bg-yellow-300 px-4 py-1.5 text-xs font-bold"
                  >
                    关闭
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Minimal Footer */}
          <footer className="border-t-4 border-black bg-white py-4 text-center"></footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
<section data-tp-seo-context aria-label="本站简介" style="max-width:70ch;margin:2rem auto 1rem;padding:0 1rem;color:#6b7280;font-size:.72rem;line-height:1.6;opacity:.62;text-align:center"><p style="margin:0">《学长我有一个问题…》：面向学生的经验问答与校园信息整理，汇总学习、生活、选择与成长过程中常见问题的实用参考。</p></section>
</body>
</html>
